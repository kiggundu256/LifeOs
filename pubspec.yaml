name: lifeos
description: A private, local-first productivity and creative command-center app.
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  file_picker: ^10.3.3
  path_provider: ^2.1.5
  open_filex: ^4.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
