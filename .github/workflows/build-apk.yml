name: LifeOS Android quality checks and APK

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name lifeos .
      - name: Configure Android scheduled notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />'
          if permission not in content:
              content = content.replace('    <application', permission + '\\n    <application', 1)
          receivers = """        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>"""
          if "ScheduledNotificationBootReceiver" not in content:
              content = content.replace('</application>', receivers + '\\n    </application>', 1)
          manifest.write_text(content)
          PY
      - name: Remove generated placeholder widget test
        run: rm -f test/widget_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-pub
      - name: Run tests
        run: flutter test --no-pub
      - name: Build release APK
        run: flutter build apk --release --no-pub
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
